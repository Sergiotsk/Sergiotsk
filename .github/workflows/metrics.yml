name: Metrics

on:
  workflow_dispatch:
  schedule:
    # Corre todos los días a las 06:00 UTC (03:00 ART)
    - cron: "0 6 * * *"
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Requiere un PAT con scopes: repo, read:user
          # Crearlo en GitHub → Settings → Developer settings → Personal access tokens
          # y guardarlo como secret del repo con el nombre METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sergiotsk
          template: classic
          # Sin "header" (evita mostrar nombre/avatar) ni "community" (2 de 3
          # stats en cero: sponsors/sponsoring). Queda solo lo que tiene datos reales.
          base: activity, repositories, metadata
          config_timezone: America/Argentina/Buenos_Aires
          config_output: svg

          # Top lenguajes (reemplaza github-readme-stats top-langs)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          # Filtra lenguajes con presencia casi nula (antes en 0%, ahora exige mínimo 1%)
          plugin_languages_threshold: 1%

          # Calendario isométrico de commits (más vistoso que el streak actual)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # plugin_habits desactivado: bug conocido en lowlighter/metrics
          # (TypeError al destructurar 'author' de un evento sin ese campo,
          # source/plugins/habits/index.mjs:51). No depende de nuestra config,
          # rompe con ciertos tipos de evento en el feed de actividad.
