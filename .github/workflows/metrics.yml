name: Metrics

on:
  workflow_dispatch:
  schedule:
    # Corre todos los días a las 06:00 UTC (03:00 ART)
    - cron: "0 6 * * *"
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Requiere un PAT con scopes: repo, read:user
          # Crearlo en GitHub → Settings → Developer settings → Personal access tokens
          # y guardarlo como secret del repo con el nombre METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sergiotsk
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Argentina/Buenos_Aires
          config_output: svg

          # Top lenguajes (reemplaza github-readme-stats top-langs)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # Calendario isométrico de commits (más vistoso que el streak actual)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Hábitos de código (horarios, días activos)
          plugin_habits: yes
          plugin_habits_charts_type: bars
